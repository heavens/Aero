[package]
name = "aero-desktop"
version = "0.1.0"
default-run = "aero"
edition = "2021"
rust-version = "1.80"
description = "Native desktop shell for the Aero text editor."

[[bin]]
name = "aero"
path = "src/main.rs"

[dependencies]
aero-engine = { path = "../engine", version = "0.1.0" }
env_logger = "0.11"
log = "0.4"
tao = "0.37"
wry = "0.57"
