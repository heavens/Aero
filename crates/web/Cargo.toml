[package]
name = "zephyr-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.60"

[lib]
crate-type = ["cdylib"]

[dependencies.web-sys]
version = "0.3.22"
features = ["console"]

[dependencies]
env_logger = "0.10"
futures = { version = "0.3.28", features = ["executor"]}
fontdb = "0.13"
js-sys = "0.3.22"
log = "0.4"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.99"
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "0.3.22"
zephyr-shared = { path = "../shared", version = "0.1.0" }
