[package]
name = "aero-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "WebAssembly bindings that run the Aero engine in the browser."

[lib]
crate-type = ["cdylib"]

[dependencies]
aero-engine = { path = "../engine", version = "0.1.0" }
js-sys = "0.3"
log = "0.4"
log4wasm = "0.1.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
